name: HustleHub+ CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Backend Setup, Lint & Tests
      - name: Install Backend Dependencies
        run: |
          cd hustlehub-backend
          npm install

      - name: Lint Backend
        run: |
          cd hustlehub-backend
          npm run lint

      - name: Run Backend Tests
        run: |
          cd hustlehub-backend
          npm test
        env:
          PORT: 5000
          JWT_SECRET: ci_test_jwt_secret_key_12345
          MONGODB_URI: mongodb://127.0.0.1:27017/hustlehub_test

      # 2. Frontend Setup, Lint & Build Check
      - name: Install Frontend Dependencies
        run: |
          cd hustlehub-frontend
          npm install

      - name: Lint Frontend
        run: |
          cd hustlehub-frontend
          npm run lint

      - name: Build Frontend Application
        run: |
          cd hustlehub-frontend
          npm run build
        env:
          VITE_API_URL: https://localhost:5000

      # 3. Docker Containerisation & Verification
      - name: Create dummy .env for Docker Compose
        run: |
          touch hustlehub-backend/.env
          touch hustlehub-frontend/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test Docker Containers via Compose
        run: |
          docker compose up --build -d
          
      - name: Verify Container Health & Running Status
        run: |
          docker ps
          # Check if backend container is running
          if [ "$(docker inspect -f '{{.State.Running}}' hustlehub-backend)" != "true" ]; then
            echo "Backend container failed to run!"
            exit 1
          fi
          # Check if frontend container is running
          if [ "$(docker inspect -f '{{.State.Running}}' hustlehub-frontend)" != "true" ]; then
            echo "Frontend container failed to run!"
            exit 1
          fi

      - name: Teardown Docker Environment
        if: always()
        run: |
          docker compose down || true